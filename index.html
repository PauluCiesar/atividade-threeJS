<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atividade Three.js — Constable's House</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #1a1a2e;
    }

    canvas {
      display: block;
    }

    #info {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #fff;
      font-family: sans-serif;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.45);
      padding: 8px 12px;
      border-radius: 6px;
      pointer-events: none;
    }

    #carregando {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-family: sans-serif;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div id="info">Constable's House — arraste para rotacionar | scroll para zoom | botão direito para mover</div>
  <div id="carregando">Carregando modelo...</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const cena = new THREE.Scene();
    cena.background = new THREE.Color(0x87ceeb);
    cena.fog = new THREE.Fog(0x87ceeb, 30, 100);

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 5, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const luzAmbiente = new THREE.AmbientLight(0xffeedd, 0.6);
    cena.add(luzAmbiente);

    const luzDirecional = new THREE.DirectionalLight(0xffffff, 1.2);
    luzDirecional.position.set(10, 20, 10);
    luzDirecional.castShadow = true;
    luzDirecional.shadow.mapSize.width = 2048;
    luzDirecional.shadow.mapSize.height = 2048;
    cena.add(luzDirecional);

    const controles = new OrbitControls(camera, renderer.domElement);
    controles.enableDamping = true;
    controles.dampingFactor = 0.05;
    controles.minDistance = 2;
    controles.maxDistance = 80;

    const carregador = new GLTFLoader();

    carregador.load(
      'modelo/scene.gltf',
      (gltf) => {
        const modelo = gltf.scene;

        modelo.traverse((objeto) => {
          if (objeto.isMesh) {
            objeto.castShadow = true;
            objeto.receiveShadow = true;
          }
        });

        cena.add(modelo);

        const caixa = new THREE.Box3().setFromObject(modelo);
        const centro = caixa.getCenter(new THREE.Vector3());
        const tamanho = caixa.getSize(new THREE.Vector3());
        const distancia = Math.max(tamanho.x, tamanho.y, tamanho.z) * 1.8;

        camera.position.set(
          centro.x,
          centro.y + tamanho.y * 0.5,
          centro.z + distancia
        );
        controles.target.copy(centro);
        controles.update();

        document.getElementById('carregando').style.display = 'none';
      },
      (progresso) => {
        if (progresso.total > 0) {
          const porcentagem = Math.round((progresso.loaded / progresso.total) * 100);
          document.getElementById('carregando').textContent =
            `Carregando modelo... ${porcentagem}%`;
        }
      },
      (erro) => {
        console.error('Erro ao carregar o modelo:', erro);
        document.getElementById('carregando').textContent =
          'Erro ao carregar o modelo. Verifique o console.';
      }
    );

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animar() {
      requestAnimationFrame(animar);
      controles.update();
      renderer.render(cena, camera);
    }

    animar();
  </script>
</body>
</html>
