<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atividade Three.js — Christchurch Castle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
    }

    #nav {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
    }

    #nav a {
      color: #fff;
      font-family: sans-serif;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.55);
      padding: 6px 14px;
      border-radius: 20px;
      text-decoration: none;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    #nav a:hover {
      background: rgba(255,255,255,0.15);
    }

    #info {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-family: sans-serif;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.55);
      padding: 8px 16px;
      border-radius: 20px;
      pointer-events: none;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    #carregando {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-family: sans-serif;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div id="nav"><a href="index.html">← Constable's House</a></div>
  <div id="info">Clique e arraste para mover | botão direito para rotacionar | scroll para zoom</div>
  <div id="carregando">Carregando modelo...</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const cena = new THREE.Scene();
    cena.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      50000
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const luzAmbiente = new THREE.AmbientLight(0xffeedd, 0.6);
    cena.add(luzAmbiente);

    const luzDirecional = new THREE.DirectionalLight(0xffffff, 1.2);
    luzDirecional.position.set(10, 20, 10);
    luzDirecional.castShadow = true;
    luzDirecional.shadow.mapSize.width = 2048;
    luzDirecional.shadow.mapSize.height = 2048;
    cena.add(luzDirecional);

    const controles = new OrbitControls(camera, renderer.domElement);
    controles.enableDamping = true;
    controles.dampingFactor = 0.05;
    controles.screenSpacePanning = true;
    controles.panSpeed = 0.3;
    controles.enableZoom = false;

    controles.mouseButtons = {
      LEFT: THREE.MOUSE.PAN,
      MIDDLE: THREE.MOUSE.DOLLY,
      RIGHT: THREE.MOUSE.ROTATE
    };

    // zoom com inércia
    const direcao = new THREE.Vector3();
    let velocidadeZoom = 0;

    renderer.domElement.addEventListener('wheel', (evento) => {
      evento.preventDefault();
      const delta = Math.sign(evento.deltaY) * Math.min(Math.abs(evento.deltaY), 80);
      velocidadeZoom += (delta / 80) * 0.006;
    }, { passive: false });

    // pivô de rotação próximo à câmera
    const direcaoRotacao = new THREE.Vector3();
    renderer.domElement.addEventListener('mousedown', (evento) => {
      if (evento.button === 2) {
        camera.getWorldDirection(direcaoRotacao);
        const distanciaAtual = camera.position.distanceTo(controles.target);
        const pivoDist = Math.max(distanciaAtual * 0.15, 10);
        controles.target
          .copy(camera.position)
          .addScaledVector(direcaoRotacao, pivoDist);
        controles.update();
      }
    });

    const carregador = new GLTFLoader();

    carregador.load(
      'modelo2/scene.gltf',
      (gltf) => {
        const modelo = gltf.scene;

        modelo.traverse((objeto) => {
          if (objeto.isMesh) {
            objeto.castShadow = true;
            objeto.receiveShadow = true;
          }
        });

        cena.add(modelo);

        const caixa = new THREE.Box3().setFromObject(modelo);
        const centro = caixa.getCenter(new THREE.Vector3());
        const tamanho = caixa.getSize(new THREE.Vector3());

        const distanciaInicial = Math.max(tamanho.x, tamanho.y, tamanho.z) * 0.6;
        camera.position.set(centro.x, centro.y, centro.z + distanciaInicial);

        controles.target.copy(centro);
        controles.update();

        document.getElementById('carregando').style.display = 'none';
      },
      (progresso) => {
        if (progresso.total > 0) {
          const porcentagem = Math.round((progresso.loaded / progresso.total) * 100);
          document.getElementById('carregando').textContent =
            `Carregando modelo... ${porcentagem}%`;
        }
      },
      (erro) => {
        console.error('Erro ao carregar o modelo:', erro);
        document.getElementById('carregando').textContent =
          'Erro ao carregar o modelo. Verifique o console.';
      }
    );

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animar() {
      requestAnimationFrame(animar);

      if (Math.abs(velocidadeZoom) > 0.00001) {
        camera.getWorldDirection(direcao);
        const distancia = camera.position.distanceTo(controles.target);
        const passo = distancia * velocidadeZoom;
        camera.position.addScaledVector(direcao, -passo);
        controles.target.addScaledVector(direcao, -passo);
        velocidadeZoom *= 0.80;
      }

      controles.update();
      renderer.render(cena, camera);
    }

    animar();
  </script>
</body>
</html>
